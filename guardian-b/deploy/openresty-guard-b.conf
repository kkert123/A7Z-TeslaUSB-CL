# guardian-b · OpenResty(1Panel) 反向代理
# ============================================================
# 作用：公网 443 终结 TLS（自签证书 + A 侧 pinning）→ 反代到 127.0.0.1:8800。
# 放置：1Panel → 网站/OpenResty → 新增反向代理，或直接落到 conf.d。
# 证书：由 tls/gen_selfsigned.sh 生成，ssl_certificate 用 fullchain.crt。
#
# 注意：
#  - 公网只开 443（+ ACME 用 80，本方案自签不依赖 ACME，可不开口岸）；
#  - TS 通道不经过这里：见文件末尾「TS 通道」注释块（或让 A 直连 TS IP:8800）。

# ⚠️ limit_req_zone 只能出现在 http 上下文（不是 server 里）。
#    1Panel 请加到「网站 → 全局配置 / nginx.conf 的 http{}」；自管 conf.d 请加到 http{}。
#    limit_req_zone $binary_remote_addr zone=guardb:1m rate=60r/m;

# ── 公网 HTTPS（默认启用）────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # 自签证书（A 侧 pinning 信任；浏览器会告警，属预期）
    ssl_certificate     /opt/guard-b/tls/fullchain.crt;
    ssl_certificate_key /opt/guard-b/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GUARDB:1m;

    # 心跳是「单客户端、低频」，限流只挡探测扫描（M89：限频率不限动作）
    limit_req zone=guardb burst=10 nodelay;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # 无鉴权存活探针，直透
    location = /healthz {
        proxy_pass http://127.0.0.1:8800/healthz;
        access_log off;
    }
}

# ── TS 通道（可选）────────────────────────────────────────────
# 方案 A（推荐，最简）：不给 TS 反代，A 直接访问 http://<TS_IP>:8800
#   —— 需 GUARD_BIND_HOST 改为 TS 接口地址（100.x.x.x），或防火墙放行 tailscale0 到 8800。
#   —— TS 本身是 WireGuard 加密，无需再套 TLS。
# 方案 B：在 TS 接口上再起一段明文监听反代（同样不套 TLS）：
#
# server {
#     listen <TS_IP>:8800;
#     server_name _;
#     location / { proxy_pass http://127.0.0.1:8800; }
# }
